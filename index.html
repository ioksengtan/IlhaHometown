<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>芎鄉遍野</title>
</head>

<style>
	:root {
		--vv-top: 0px;
		--vv-right: 0px;
		--vv-bottom: 0px;
		--vv-left: 0px;
		--vv-height: 100dvh;
	}

	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #000;
		/* manipulation: pinch still works, double-tap zoom does not. */
		touch-action: manipulation;
		-webkit-text-size-adjust: 100%;
		text-size-adjust: 100%;
	}

	canvas {
		/*border: 1px solid black;*/
		padding: 0;
		margin: 0;
		display: block;
		max-width: 100%;
		max-height: 100%;
		object-fit: contain;
		object-position: center;
		touch-action: none;
		position: fixed;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
	}

	/* Wide / landscape: fill height (same as the old desktop look). */
	@media (min-aspect-ratio: 1024/768) {
		canvas {
			height: 100%;
			width: auto;
		}
	}

	/* Narrow / tall: fit by width so the 4:3 canvas is fully visible. */
	@media (max-aspect-ratio: 1024/768) {
		canvas {
			width: 100%;
			height: auto;
		}
	}

	/* Dialog and NPC pages share one viewport-sized box.
	   Desktop caps stay 1000px / 900px; phones use the visible width
	   instead of a fixed 900px panel that overflows portrait screens.
	   top/bottom follow the visual viewport plus the device safe area
	   so the box stays above the URL bar, toolbar, and home indicator. */
	.cssdialog,
	.csspage {
		background-image: url('assets/talk.png');
		box-sizing: border-box;
		display: none;
		position: fixed;
		z-index: 5;
		left: calc(var(--vv-left, 0px) + env(safe-area-inset-left, 0px));
		right: calc(var(--vv-right, 0px) + env(safe-area-inset-right, 0px));
		margin-top: 0;
		margin-bottom: 0;
		margin-left: auto;
		margin-right: auto;
		padding: 16px 30px;
		overflow-x: hidden;
		overflow-y: auto;
		-webkit-overflow-scrolling: touch;
		touch-action: manipulation;
		cursor: pointer;
		-webkit-user-select: none;
		user-select: none;
		-webkit-tap-highlight-color: transparent;
		color: #222;
		overflow-wrap: anywhere;
	}

	.cssdialog img,
	.csspage img,
	.cssdialog video,
	.csspage video,
	.cssdialog iframe,
	.csspage iframe {
		max-width: 100%;
		height: auto;
	}

	.cssdialog a,
	.csspage a {
		cursor: pointer;
	}

	.cssdialog {
		top: auto;
		bottom: calc(10px + env(safe-area-inset-bottom, 0px) + var(--vv-bottom, 0px));
		height: 26%;
		height: 26svh;
		max-height: calc(var(--vv-height, 100svh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--vv-top, 0px) - var(--vv-bottom, 0px) - 20px);
		width: min(1000px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
		max-width: min(1000px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
	}

	.csspage {
		top: calc(100px + env(safe-area-inset-top, 0px) + var(--vv-top, 0px));
		bottom: calc(80px + env(safe-area-inset-bottom, 0px) + var(--vv-bottom, 0px));
		width: min(900px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
		max-width: min(900px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
	}

	@media (max-width: 600px) {
		.cssdialog,
		.csspage {
			padding-left: 16px;
			padding-right: 16px;
			padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
			font-size: 18px;
			line-height: 1.5;
		}

		.cssdialog {
			height: 36%;
			height: 36svh;
			bottom: calc(12px + env(safe-area-inset-bottom, 0px) + var(--vv-bottom, 0px));
		}

		.csspage {
			top: calc(16px + env(safe-area-inset-top, 0px) + var(--vv-top, 0px));
			bottom: calc(16px + env(safe-area-inset-bottom, 0px) + var(--vv-bottom, 0px));
		}
	}

	 
</style>

<body onload="OnLoad()" onresize="if (window.OnResize) OnResize()">
	<canvas id="canvas" width="1024" height="768"></canvas>
	<div class="cssdialog" id="dialog"></div>
	<div class="csspage" id="page"> </div>
	<script type=" text/javascript" src="js/jquery-1.9.0.min.js">
		</script>
	<script src="js/markdown.js"></script>
	<script src="js/html_preprocessing.js"></script>
	<script src="js/mdpp.js"></script>

	<script src="js/hpcomm.js"></script>
	<script src="js/index.js"></script>


</body>

</html>
