<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>芎鄉遍野</title>
</head>

<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #000;
		touch-action: manipulation;
		-webkit-text-size-adjust: 100%;
		text-size-adjust: 100%;
	}

	canvas {
		/*border: 1px solid black;*/
		padding: 0;
		margin: 0;
		display: block;
		max-width: 100%;
		max-height: 100%;
		object-fit: contain;
		object-position: center;
		touch-action: none;
		position: fixed;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
	}

	/* Wide / landscape: fill height (same as the old desktop look). */
	@media (min-aspect-ratio: 1024/768) {
		canvas {
			height: 100%;
			width: auto;
		}
	}

	/* Narrow / tall: fit by width so the 4:3 canvas is fully visible. */
	@media (max-aspect-ratio: 1024/768) {
		canvas {
			width: 100%;
			height: auto;
		}
	}

	/* Dialog and NPC pages share one viewport-sized box.
	   Desktop caps stay 1000px / 900px; phones use the visible width
	   instead of a fixed 900px panel that overflows portrait screens. */
	.cssdialog,
	.csspage {
		background-image: url('assets/talk.png');
		box-sizing: border-box;
		display: none;
		position: fixed;
		z-index: 5;
		top: 0;
		left: 0;
		right: 0;
		bottom: 0;
		margin-left: auto;
		margin-right: auto;
		padding: 16px 30px;
		overflow-x: hidden;
		overflow-y: auto;
		-webkit-overflow-scrolling: touch;
		touch-action: manipulation;
		cursor: pointer;
		-webkit-user-select: none;
		user-select: none;
		-webkit-tap-highlight-color: transparent;
		color: #222;
		overflow-wrap: anywhere;
	}

	.cssdialog img,
	.csspage img,
	.cssdialog video,
	.csspage video,
	.cssdialog iframe,
	.csspage iframe {
		max-width: 100%;
		height: auto;
	}

	.cssdialog a,
	.csspage a {
		cursor: pointer;
	}

	.cssdialog {
		height: 26%;
		margin-top: auto;
		margin-bottom: 10px;
		width: min(1000px, calc(100% - 24px));
		max-width: min(1000px, calc(100% - 24px));
	}

	.csspage {
		margin-top: 100px;
		margin-bottom: 80px;
		width: min(900px, calc(100% - 24px));
		max-width: min(900px, calc(100% - 24px));
	}

	@media (max-width: 600px) {
		.cssdialog,
		.csspage {
			padding-left: 16px;
			padding-right: 16px;
			font-size: 18px;
			line-height: 1.5;
		}

		.cssdialog {
			height: 36%;
		}

		.csspage {
			margin-top: 16px;
			margin-bottom: 16px;
		}
	}

	 
</style>

<body onload="OnLoad()" onresize="if (window.OnResize) OnResize()">
	<canvas id="canvas" width="1024" height="768"></canvas>
	<div class="cssdialog" id="dialog"></div>
	<div class="csspage" id="page"> </div>
	<script type=" text/javascript" src="js/jquery-1.9.0.min.js">
		</script>
	<script src="js/markdown.js"></script>
	<script src="js/html_preprocessing.js"></script>
	<script src="js/mdpp.js"></script>

	<script src="js/hpcomm.js"></script>
	<script src="js/index.js"></script>


</body>

</html>
